<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>The Tijuana Project - Render PS2 Pipeline</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #overlay {
            position: absolute; top:0; left:0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); color: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        button { 
            padding: 15px 30px; font-size: 20px; cursor: pointer; 
            border: 2px solid white; background: #222; color: white;
            transition: background 0.3s;
        }
        button:hover { background: #555; }
    </style>
</head>
<body>
    <div id="overlay">
        <h1>Tijuana Project Engine</h1>
        <p>Motor WebGL Custom y Audio Panner 3D (Arquitectura PS2)</p>
        <button id="btnStart">Iniciar Motor</button>
    </div>
    
    <!-- Lienzo WebGL -->
    <canvas id="gameCanvas"></canvas>
    
    <!-- Punto de entrada general tipo ES Module -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
